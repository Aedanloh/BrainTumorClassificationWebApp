<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - NeuroClassify Diagnostics</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Auth Style -->
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- Holographic Left Panel with Hovering Brain -->
            <div class="auth-graphic">
                <div class="brain-container">
                    <!-- Animated Hovering Hologram Brain -->
                    <svg class="hologram-brain" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <!-- Connecting dashed neural pathways -->
                        <line x1="80" y1="80" x2="100" y2="70" class="brain-connection" />
                        <line x1="80" y1="80" x2="70" y2="110" class="brain-connection" />
                        <line x1="70" y1="110" x2="90" y2="135" class="brain-connection" />
                        <line x1="90" y1="135" x2="100" y2="160" class="brain-connection" />
                        <line x1="120" y1="80" x2="100" y2="70" class="brain-connection" />
                        <line x1="120" y1="80" x2="130" y2="110" class="brain-connection" />
                        <line x1="130" y1="110" x2="110" y2="135" class="brain-connection" />
                        <line x1="110" y1="135" x2="100" y2="160" class="brain-connection" />
                        <line x1="100" y1="70" x2="100" y2="100" class="brain-connection" />
                        <line x1="100" y1="100" x2="100" y2="130" class="brain-connection" />
                        <line x1="100" y1="130" x2="100" y2="160" class="brain-connection" />
                        <line x1="80" y1="80" x2="120" y2="80" class="brain-connection" />
                        <line x1="70" y1="110" x2="130" y2="110" class="brain-connection" />
                        <line x1="90" y1="135" x2="110" y2="135" class="brain-connection" />
                        
                        <!-- Outer brain contours -->
                        <!-- Left Hemisphere -->
                        <path d="M 100,50 C 70,45 45,70 45,100 C 45,125 60,135 75,145 C 85,150 92,157 95,162 C 98,165 99,168 100,170" class="brain-path" />
                        <!-- Right Hemisphere -->
                        <path d="M 100,50 C 130,45 155,70 155,100 C 155,125 140,135 125,145 C 115,150 108,157 105,162 C 102,165 101,168 100,170" class="brain-path" />
                        <!-- Core Midline -->
                        <path d="M 100,50 L 100,170" class="brain-path" style="stroke-dasharray: 6 4; opacity: 0.5;" />
                        
                        <!-- Glowing Synapse Nodes -->
                        <circle cx="100" cy="50" r="4" class="brain-node" />
                        <circle cx="100" cy="70" r="3.5" class="brain-node" style="animation-delay: 0.3s;" />
                        <circle cx="100" cy="100" r="3.5" class="brain-node" style="animation-delay: 0.6s;" />
                        <circle cx="100" cy="130" r="3.5" class="brain-node" style="animation-delay: 0.9s;" />
                        <circle cx="100" cy="160" r="3.5" class="brain-node" style="animation-delay: 1.2s;" />
                        <circle cx="100" cy="170" r="4" class="brain-node" />
                        
                        <circle cx="80" cy="80" r="3.5" class="brain-node" style="animation-delay: 0.2s;" />
                        <circle cx="120" cy="80" r="3.5" class="brain-node" style="animation-delay: 0.4s;" />
                        <circle cx="70" cy="110" r="3.5" class="brain-node" style="animation-delay: 0.6s;" />
                        <circle cx="130" cy="110" r="3.5" class="brain-node" style="animation-delay: 0.8s;" />
                        <circle cx="90" cy="135" r="3.5" class="brain-node" style="animation-delay: 1.0s;" />
                        <circle cx="110" cy="135" r="3.5" class="brain-node" style="animation-delay: 1.2s;" />
                    </svg>
                    <div class="hologram-base"></div>
                </div>
                
                <div class="graphic-text">
                    <h2>NeuroClassify</h2>
                    <p>Deep learning medical imaging classification system. Providing diagnostic insights and explainability metrics for neuro-oncology.</p>
                </div>
            </div>
            
            <!-- Auth Form Panel -->
            <div class="auth-form-container">
                <div class="form-header">
                    <h3 id="form-title">Welcome back, Doctor</h3>
                    <p id="form-subtitle">Please enter your credentials to access the MRI Analyzer.</p>
                </div>
                
                <!-- Error Banner -->
                <div class="error-banner" id="error-banner" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-message">Error message details here.</span>
                </div>

                <form id="auth-form" class="auth-form">
                    <!-- Name Field (Only visible in Register mode) -->
                    <div class="input-group" id="name-group" style="display: none;">
                        <label for="doctor-name">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="text" id="doctor-name" placeholder="Dr. Jane Doe">
                        </div>
                    </div>
                    
                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="doctor-email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input type="email" id="doctor-email" placeholder="jane.doe@hospital.com" required>
                        </div>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="doctor-password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="doctor-password" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                        <i class="fa-solid fa-right-to-bracket"></i> <span id="submit-text">Log In</span>
                    </button>
                </form>
                
                <!-- Switch Auth Mode Link -->
                <div class="auth-switch">
                    <span id="switch-prompt">New to the platform?</span>
                    <a href="#" id="switch-link">Create an account</a>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Auth Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const authForm = document.getElementById("auth-form");
            const nameGroup = document.getElementById("name-group");
            const doctorName = document.getElementById("doctor-name");
            const doctorEmail = document.getElementById("doctor-email");
            const doctorPassword = document.getElementById("doctor-password");
            const submitBtn = document.getElementById("submit-btn");
            const submitText = document.getElementById("submit-text");
            const formTitle = document.getElementById("form-title");
            const formSubtitle = document.getElementById("form-subtitle");
            const switchPrompt = document.getElementById("switch-prompt");
            const switchLink = document.getElementById("switch-link");
            const errorBanner = document.getElementById("error-banner");
            const errorMessage = document.getElementById("error-message");
            
            let isRegisterMode = false;
            
            // Check if user is already logged in on load
            fetch("../backend/auth.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "check_session" })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.logged_in) {
                    window.location.href = "index.html"; // Already logged in, redirect
                }
            });
            
            // Switch Auth Mode (Login vs Register)
            switchLink.addEventListener("click", (e) => {
                e.preventDefault();
                errorBanner.style.display = "none";
                isRegisterMode = !isRegisterMode;
                
                if (isRegisterMode) {
                    formTitle.innerText = "Register Account";
                    formSubtitle.innerText = "Set up your medical diagnostic account details.";
                    nameGroup.style.display = "block";
                    doctorName.required = true;
                    submitText.innerText = "Register Account";
                    submitBtn.querySelector("i").className = "fa-solid fa-user-plus";
                    switchPrompt.innerText = "Already registered?";
                    switchLink.innerText = "Log in here";
                } else {
                    formTitle.innerText = "Welcome back, Doctor";
                    formSubtitle.innerText = "Please enter your credentials to access the MRI Analyzer.";
                    nameGroup.style.display = "none";
                    doctorName.required = false;
                    submitText.innerText = "Log In";
                    submitBtn.querySelector("i").className = "fa-solid fa-right-to-bracket";
                    switchPrompt.innerText = "New to the platform?";
                    switchLink.innerText = "Create an account";
                }
            });
            
            // Form Submit Handler
            authForm.addEventListener("submit", (e) => {
                e.preventDefault();
                errorBanner.style.display = "none";
                submitBtn.disabled = true;
                
                const action = isRegisterMode ? "signup" : "login";
                
                const payload = {
                    action: action,
                    email: doctorEmail.value,
                    password: doctorPassword.value
                };
                
                if (isRegisterMode) {
                    payload.name = doctorName.value;
                }
                
                fetch("../backend/auth.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    submitBtn.disabled = false;
                    if (data.success) {
                        window.location.href = "index.html"; // Redirect to dashboard
                    } else {
                        showError(data.error || "An authentication error occurred.");
                    }
                })
                .catch(err => {
                    submitBtn.disabled = false;
                    showError("Failed to connect to authentication server.");
                });
            });
            
            function showError(msg) {
                errorBanner.style.display = "flex";
                errorMessage.innerText = msg;
            }
        });
    </script>
</body>
</html>
